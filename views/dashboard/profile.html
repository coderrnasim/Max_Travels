<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>User Profile - Max Travels</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Exo+2:ital,wght@0,100..900;1,100..900&family=Inter:wght@400;500;600;700;800;900&display=swap"
        rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
        }

        .font-exo {
            font-family: 'Exo 2', sans-serif;
        }

        .profile-bg {
            background: linear-gradient(135deg, rgba(119, 192, 67, 0.15) 0%, rgba(14, 35, 57, 0.08) 100%);
        }

        .heavy-shadow {
            box-shadow: 0 25px 50px -12px rgba(14, 35, 57, 0.25), 0 0 35px rgba(119, 192, 67, 0.25);
            transition: all 0.4s ease;
        }

        .heavy-shadow:hover {
            transform: translateY(-4px);
            box-shadow: 0 30px 60px -12px rgba(14, 35, 57, 0.3), 0 0 45px rgba(119, 192, 67, 0.35);
        }

        .glass-green-btn {
            background: linear-gradient(135deg, rgba(119, 192, 67, 0.95), rgba(90, 150, 45, 0.95));
            backdrop-filter: blur(10px);
            color: #ffffff;
            border: 1px solid rgba(255, 255, 255, 0.4);
            box-shadow: 0 10px 25px rgba(119, 192, 67, 0.4);
            transition: all 0.3s ease;
        }

        .glass-green-btn:hover {
            background: linear-gradient(135deg, rgba(119, 192, 67, 1), rgba(75, 130, 35, 1));
            border-color: #ffffff;
            box-shadow: 0 15px 30px rgba(119, 192, 67, 0.6);
            transform: translateY(-2px);
        }
    </style>
</head>

<body class="profile-bg min-h-screen text-[#0E2339] flex items-center justify-center p-3 sm:p-4 overflow-y-auto">

    <!-- Main Profile Card Container -->
    <div
        class="bg-white w-full max-w-xl rounded-3xl heavy-shadow p-5 sm:p-7 space-y-5 border-2 border-[#77C043]/30 my-auto">

        <!-- Profile Header & Extra Large Avatar Section -->
        <div class="flex flex-col items-center text-center space-y-3">
            <div class="relative group">
                <img id="profilePageAvatar" src="" alt="Profile Picture"
                    class="w-40 h-40 sm:w-48 sm:h-48 rounded-full object-cover border-4 border-[#77C043] shadow-xl">

                <!-- Upload Camera Button Overlay -->
                <label for="avatarUploadInput"
                    class="absolute bottom-1 right-1 bg-[#0E2339] text-[#77C043] p-3 rounded-full cursor-pointer shadow-lg hover:bg-[#77C043] hover:text-white transition-all transform hover:scale-110">
                    <i class="fa-solid fa-camera text-base"></i>
                </label>
                <input type="file" id="avatarUploadInput" accept="image/*" class="hidden"
                    onchange="handleAvatarUpload(event)">
            </div>

            <div class="space-y-1">
                <h2 id="profileName" class="text-2xl sm:text-3xl font-black text-[#0E2339] font-exo">Loading...</h2>
                <div class="flex items-center justify-center gap-3 mt-1 flex-wrap">
                    <span id="profileRoleBadge"
                        class="px-4 py-0.5 bg-[#77C043]/20 text-[#0E2339] text-sm sm:text-base font-black rounded-full border border-[#77C043]/40">Role</span>
                    <span id="profileLocation"
                        class="text-sm sm:text-base font-extrabold text-gray-700 bg-gray-100 px-3 py-0.5 rounded-full">Location</span>
                </div>
            </div>
        </div>

        <hr class="border-gray-200 my-2">

        <!-- User Information Details -->
        <div class="space-y-2.5 text-sm sm:text-base">
            <div class="flex justify-between items-center bg-gray-50 px-4 py-3 rounded-xl border border-gray-200">
                <span class="font-bold text-gray-600 flex items-center"><i
                        class="fa-solid fa-user mr-3 text-[#77C043] text-lg"></i> Full Name</span>
                <span id="infoName" class="font-black text-[#0E2339] text-base sm:text-lg">-</span>
            </div>

            <div class="flex justify-between items-center bg-gray-50 px-4 py-3 rounded-xl border border-gray-200">
                <span class="font-bold text-gray-600 flex items-center"><i
                        class="fa-solid fa-shield-halved mr-3 text-[#77C043] text-lg"></i> User Role /
                    Designation</span>
                <span id="infoRole" class="font-black text-[#0E2339] text-base sm:text-lg">-</span>
            </div>

            <div class="flex justify-between items-center bg-gray-50 px-4 py-3 rounded-xl border border-gray-200">
                <span class="font-bold text-gray-600 flex items-center"><i
                        class="fa-solid fa-location-dot mr-3 text-[#77C043] text-lg"></i> Assigned Counter /
                    Location</span>
                <span id="infoLocation" class="font-black text-[#0E2339] text-base sm:text-lg">-</span>
            </div>

            <div class="flex justify-between items-center bg-gray-50 px-4 py-3 rounded-xl border border-gray-200">
                <span class="font-bold text-gray-600 flex items-center"><i
                        class="fa-solid fa-phone mr-3 text-[#77C043] text-lg"></i> Contact Number</span>
                <span id="infoContact" class="font-black text-[#0E2339] text-base sm:text-lg">-</span>
            </div>

            <div class="flex justify-between items-center bg-gray-50 px-4 py-3 rounded-xl border border-gray-200">
                <span class="font-bold text-gray-600 flex items-center"><i
                        class="fa-solid fa-id-card mr-3 text-[#77C043] text-lg"></i> User ID / Status</span>
                <span id="infoStatus" class="font-black text-emerald-700 text-base sm:text-lg">Active Account</span>
            </div>
        </div>

        <!-- Action Button: Save & Go Back Dashboard -->
        <div class="pt-2">
            <button type="button" onclick="saveAndGoToDashboard()"
                class="glass-green-btn w-full py-3.5 sm:py-4 text-center font-black rounded-2xl text-base sm:text-lg flex items-center justify-center gap-3 cursor-pointer">
                <i class="fa-solid fa-circle-chevron-left text-xl"></i> Save & Go Back Dashboard
            </button>
        </div>

    </div>

    <!-- Script to Load Profile Data and Handle Picture Upload -->
    <script>
        document.addEventListener("DOMContentLoaded", () => {
            const savedUser = JSON.parse(localStorage.getItem('loggedUser')) || {
                name: "Faruk Mia",
                role: "Admin",
                city: "Bholahat",
                counter: "Bholahat Counter",
                avatarUrl: ""
            };

            const name = savedUser.name || "Faruk Mia";
            let role = savedUser.role || "Admin";

            if (name.toLowerCase().includes("nasim")) {
                role = "Super Admin";
            } else if (name.toLowerCase().includes("faruk")) {
                role = "Admin";
            }

            let location = "Head Office";
            const lowerRole = role.toLowerCase();
            if (lowerRole !== 'super admin' && lowerRole !== 'admin' && lowerRole !== 'superadmin') {
                location = savedUser.counter || savedUser.city || "Bholahat Counter";
            }

            const contact = savedUser.contact || savedUser.phone || savedUser.mobile || "01700000000";

            document.getElementById('profileName').innerText = name;
            document.getElementById('profileRoleBadge').innerText = role;
            document.getElementById('profileLocation').innerText = location;

            document.getElementById('infoName').innerText = name;
            document.getElementById('infoRole').innerText = role;
            document.getElementById('infoLocation').innerText = location;
            document.getElementById('infoContact').innerText = contact;

            // প্রোফাইল পিকচার হ্যান্ডেলিং
            const avatarImgEl = document.getElementById('profilePageAvatar');
            if (avatarImgEl) {
                const userSpecificAvatarKey = `permanent_avatar_${name.replace(/\s+/g, '_')}`;
                const permanentAvatar = localStorage.getItem(userSpecificAvatarKey);

                if (permanentAvatar) {
                    avatarImgEl.src = permanentAvatar;
                } else if (savedUser.avatarUrl && savedUser.avatarUrl.trim() !== "") {
                    avatarImgEl.src = savedUser.avatarUrl;
                } else {
                    const encodedName = encodeURIComponent(name);
                    avatarImgEl.src = `https://ui-avatars.com/api/?name=${encodedName}&background=0E2339&color=77C043&size=200&bold=true`;
                }
            }
        });

        // প্রোফাইল ছবি আপলোড এবং উভয় স্টোরেজে পার্মানেন্টলি সেভ করার ফাংশন
        function handleAvatarUpload(event) {
            const file = event.target.files[0];
            let savedUser = JSON.parse(localStorage.getItem('loggedUser')) || { name: "User" };
            const name = savedUser.name || "User";

            if (file) {
                const reader = new FileReader();
                reader.onload = function (e) {
                    const base64Image = e.target.result;
                    document.getElementById('profilePageAvatar').src = base64Image;

                    // ১. পার্মানেন্ট কি তে সেভ করা
                    const userSpecificAvatarKey = `permanent_avatar_${name.replace(/\s+/g, '_')}`;
                    localStorage.setItem(userSpecificAvatarKey, base64Image);

                    // ২. loggedUser অবজেক্টের ভেতরেও avatarUrl আপডেট করে লোকাল স্টোরেজে সেভ করা (যাতে ড্যাশবোর্ডও ছবি পায়)
                    savedUser.avatarUrl = base64Image;
                    localStorage.setItem('loggedUser', JSON.stringify(savedUser));
                };
                reader.readAsDataURL(file);
            }
        }

        function saveAndGoToDashboard() {
            window.location.href = "dashboard.html";
        }
    </script>
</body>

</html>
